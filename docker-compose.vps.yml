# autoflow na VPS — isolado do resto do servidor:
#  - nenhuma porta aberta (não mexe no Caddy/80/443); o acesso de fora é só pelo túnel da Cloudflare
#  - Redis próprio, só visível para os containers daqui
#
# Na VPS, dentro de /opt/autoflow:
#   docker compose -f docker-compose.vps.yml up -d --build     (subir/atualizar)
#   docker compose -f docker-compose.vps.yml logs -f api worker (ver o que está acontecendo)
#   docker compose -f docker-compose.vps.yml ps                 (situação)
name: autoflow

x-app: &app
  build: .
  env_file: .env
  environment:
    NODE_ENV: production
    PORT: '3000'
    REDIS_URL: redis://redis:6379
    MEDIA_DIR: /app/uploads
  volumes:
    - ./uploads:/app/uploads
  depends_on:
    - redis
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis:/data
    restart: unless-stopped
    mem_limit: 256m

  api:
    <<: *app
    command: ['node', 'dist/api/server.js']
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  worker:
    <<: *app
    command: ['node', 'dist/worker/index.js']
    mem_limit: 512m

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --url http://api:3000
    env_file: tunnel.env
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

volumes:
  redis:
